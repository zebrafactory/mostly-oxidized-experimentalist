name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  just-like-in-the-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-26.04-arm]
        rust: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        run: |
          rustup toolchain add ${{ matrix.rust }}
          rustup default ${{ matrix.rust }}
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt
          cargo install wasm-bindgen-cli --locked
          cargo install wasm-opt --locked
      - name: Check code formatting
        run: cargo fmt --all --check
      - name: Build for wasm32
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Run wasm-bindgen
        run: wasm-bindgen --target web --no-typescript --out-dir target/ target/wasm32-unknown-unknown/release/mostly-oxidized-experimentalist.wasm
      - name: Run wasm-opt
        run: wasm-opt -Oz -o target/mostly-oxidized-experimentalist.wasm target/wasm32-unknown-unknown/release/mostly-oxidized-experimentalist.wasm
